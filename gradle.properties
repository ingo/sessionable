#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4G
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.configuration-cache.parallel=true
org.gradle.caching=true
org.gradle.parallel=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#Development
development=true

#MPP
kotlin.mpp.enableCInteropCommonization=true

#Native
kotlin.native.binary.gc=cms
kotlin.native.binary.smallBinary=true
kotlin.incremental.native=true

# Compose Multiplatform
compose.resources.always.generate.accessors=true
org.jetbrains.compose.experimental.wasm.enabled=true
# fallback for old browsers
org.jetbrains.compose.experimental.jscanvas.enabled=true

# Branding (see docs/FORKING.md)
# The conference this build is branded for: an id from EventProfiles.kt. Leave empty for the generic
# build, where the user pastes a Sessionize link to connect to any conference.
event=
# The Android application id of the build
appId=org.example.sessionable
