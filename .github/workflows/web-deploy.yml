name: Publish the project page and web app on GitHub Pages

# Publishes, from main:
#   /       the project page (docs/site, plain HTML and CSS)
#   /app/   the web app (Kotlin/Wasm with a JavaScript fallback): the generic build, where the visitor
#           pastes a Sessionize link, with its icons, manifest and offline service worker (scripts/web-brand.sh).
#           To publish a build branded for one conference, set EVENT to its id and BRAND to its folder in
#           app/webApp/branding (see docs/FORKING.md).
# GitHub Pages must be enabled for the repository with "GitHub Actions" as its source (Settings > Pages).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  EVENT: ""
  BRAND: generic
  EVENT_TITLE: Sessionable
  EVENT_DESCRIPTION: The schedule of any conference that publishes it on Sessionize, with notes and the people you met.

jobs:
  build:
    name: Build the page and the web app
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Check the service worker and the loader
        run: |
          node app/webApp/branding/test/service-worker-test.js
          node app/webApp/branding/test/loader-test.js

      - name: Build the web app
        run: ./gradlew "-Pevent=$EVENT" :app:webApp:composeCompatibilityBrowserDistribution

      - name: Put the page and the branded web app together
        run: |
          DIST=app/webApp/build/dist/composeWebCompatibility/productionExecutable
          mkdir -p _site/app
          cp -R docs/site/. _site/
          cp -R "$DIST"/. _site/app/
          scripts/web-brand.sh "$BRAND" _site/app "$EVENT_TITLE" "$EVENT_DESCRIPTION"
          # Source maps are for debugging and about 13 MB
          find _site/app -name '*.map' -delete
          chmod -R +rX _site
          du -sh _site _site/app

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
